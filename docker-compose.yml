services:
  falkordb:
    image: falkordb/falkordb:latest
    # Not published to the host: only the `app` service reaches it, over the compose network.
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build: .
    # Optional: LLM_* settings for the agent (never committed). Without the file, /ask uses tool mode.
    env_file:
      - path: .env
        required: false
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    ports:
      # Host side configurable via APP_PORT (default 8080, 80/443 are held by the `caddy` profile);
      # container always listens on 8000.
      - "${APP_PORT:-8080}:8000"
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/').status==200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  # TLS front door (server only): docker compose --profile tls up -d
  # Caddy gets/renews a Let's Encrypt certificate for the host in ./Caddyfile via HTTP-01.
  caddy:
    image: caddy:2
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  falkordb-data:
  caddy-data:
  caddy-config:
