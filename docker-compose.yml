services:
  falkordb:
    image: falkordb/falkordb:latest
    # Not published to the host: only the `app` service reaches it, over the compose network.
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build: .
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    ports:
      # Host side configurable via APP_PORT (default 80); container always listens on 8000.
      - "${APP_PORT:-80}:8000"
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/').status==200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

volumes:
  falkordb-data:
